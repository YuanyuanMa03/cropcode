appId: com.yuanyuanma03.cropcode
productName: CropCode
artifactName: CropCode-Desktop-${version}-${os}-${arch}.${ext}
beforePack: ./scripts/prepare-runtime.mjs
afterPack: ./scripts/prepare-runtime.mjs
npmRebuild: false
directories:
  output: release
files:
  - dist/main.js
  - dist/sidecar.js
  - dist/preload.cjs
  - build/icon.png
extraResources:
  # Prepared per target from the current bundle, with matching native addons.
  - from: resources/${os}-${arch}/cropcode
    to: cropcode
  # electron-builder excludes a source root's node_modules during generic copying.
  - from: resources/${os}-${arch}/cropcode/node_modules
    to: cropcode/node_modules
icon: build/icon.png
mac:
  category: public.app-category.developer-tools
  identity: "-"
  target: dmg
win:
  target: nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
linux:
  target: AppImage
  category: Development
