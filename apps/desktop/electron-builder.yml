appId: com.yuanyuanma03.cropcode
productName: CropCode
directories:
  output: release
files:
  - dist/**
  - build/icon.png
extraResources:
  # The bundled CropCode runtime (prepare:runtime copies the latest standalone
  # build here); the shell runs it via ELECTRON_RUN_AS_NODE.
  - from: resources/cropcode
    to: cropcode
icon: build/icon.png
mac:
  category: public.app-category.developer-tools
  target: dmg
win:
  target: nsis
linux:
  target: AppImage
  category: Development
