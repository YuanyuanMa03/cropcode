name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  standalone:
    uses: ./.github/workflows/standalone.yml

  build-and-test:
    name: Node ${{ matrix.node-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node-version:
          - "22"
          - "24"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeCheck + Lint + Format Check
        run: npm run check

      - name: Build Core
        run: npm run build --workspace=@yuanyuanma03/cropcode-core

      - name: Bundle CLI
        run: npm run bundle

      - name: Smoke bundled CLI
        run: npm run smoke

      - name: Build VSCode Extension
        run: npm run build:vscode

      - name: Build workbench preview
        run: npm run build:workbench

      - name: Test
        run: npm test
