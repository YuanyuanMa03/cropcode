name: Standalone platform verification

on:
  workflow_call:

permissions:
  contents: read

jobs:
  platforms:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        run: node -e 'const p=require("./scripts/standalone/platforms.json"); console.log("matrix="+JSON.stringify({include:p.platforms}));' >> "$GITHUB_OUTPUT"
  verify:
    needs: platforms
    name: Standalone / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.platforms.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run package:cli
      - run: npm run package:standalone
      - name: Verify installation without system Node.js
        run: npm run test:standalone
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.target }}
          path: |
            release/cropcode-*-${{ matrix.target }}.tar.gz
            release/cropcode-*-${{ matrix.target }}.zip
          if-no-files-found: error
          retention-days: 7
