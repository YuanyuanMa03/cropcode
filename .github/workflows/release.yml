name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify version
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + JSON.parse(require("fs").readFileSync("package.json")).version) process.exit(1)'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run package:cli
      - run: npm run build:vscode
      - name: Prepare checksums
        run: |
          cp packages/vscode-ide-companion/*.vsix release/
          cd release
          sha256sum *.tgz *.vsix > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: cropcode-${{ github.ref_name }}
          path: release/
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.tgz release/*.vsix release/SHA256SUMS --verify-tag --title "CropCode $GITHUB_REF_NAME" --notes-file CHANGELOG.md
