name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  standalone:
    uses: ./.github/workflows/standalone.yml
  release:
    needs: standalone
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify version
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + JSON.parse(require("fs").readFileSync("package.json")).version) process.exit(1)'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run package:cli
      - run: npm run build:vscode
      - uses: actions/download-artifact@v4
        with:
          pattern: standalone-*
          path: release/
          merge-multiple: true
      - name: Verify complete release and prepare checksums
        run: |
          cp packages/vscode-ide-companion/*.vsix release/
          cp install.sh uninstall.sh install.ps1 uninstall.ps1 release/
          node scripts/verify-release-assets.js
          cd release
          sha256sum *.tgz *.vsix *.tar.gz *.zip *.sh *.ps1 > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: cropcode-${{ github.ref_name }}
          path: release/
      - name: Upload and verify draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > /tmp/cropcode-release-draft; then
            test "$(cat /tmp/cropcode-release-draft)" = true
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "CropCode $GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
          node scripts/verify-release-assets.js --uploaded
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
