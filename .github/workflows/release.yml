name: Build release packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run check && npm test

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          test "$GITHUB_REF_NAME" = "v$PACKAGE_VERSION"

      - name: Build Windows, macOS, and Linux packages
        run: npm run package:all

      - name: Test versioned installer
        run: npm run test:distribution

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cropcode-${{ github.ref_name }}
          path: |
            release/*.zip
            release/*.tar.gz
            release/SHA256SUMS
            release/manifest.json

      - name: Publish tag assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.zip release/*.tar.gz release/SHA256SUMS release/manifest.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" release/*.zip release/*.tar.gz release/SHA256SUMS release/manifest.json --generate-notes
          fi
